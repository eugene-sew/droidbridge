<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect width="960" height="560" rx="14" fill="#0f172a"/>
<text x="32" y="40" fill="#f8fafc" font-size="18" font-weight="700">DroidBridge architecture: two encrypted TCP channels, served by the Mac</text>
<text x="32" y="62" fill="#94a3b8" font-size="12">Control and video are separate so a 200 KB keyframe never blocks a tap or a keystroke</text>

<!-- column panels -->
<rect x="24" y="84" width="290" height="378" rx="12" fill="#111c33" stroke="#22c55e" stroke-opacity=".5"/>
<text x="40" y="108" fill="#22c55e" font-size="13" font-weight="700">ANDROID · Itel S26 Ultra</text>
<text x="40" y="124" fill="#94a3b8" font-size="11">Public APIs only</text>
<rect x="335" y="84" width="290" height="378" rx="12" fill="#1a1410" stroke="#FF5E00" stroke-opacity=".6"/>
<text x="351" y="108" fill="#FF8a3d" font-size="13" font-weight="700">LOCAL WI-FI</text>
<text x="351" y="124" fill="#94a3b8" font-size="11">X25519 3-DH + HKDF-SHA256 · ChaCha20-Poly1305</text>
<rect x="646" y="84" width="290" height="378" rx="12" fill="#0f1d2e" stroke="#38bdf8" stroke-opacity=".5"/>
<text x="662" y="108" fill="#38bdf8" font-size="13" font-weight="700">macOS · MacBook Air M2</text>
<text x="662" y="124" fill="#94a3b8" font-size="11">Native Swift</text>

<g font-size="12.5" fill="#e2e8f0">
  <!-- android boxes -->
  <rect x="40" y="140" width="244" height="40" rx="8" fill="#1e293b"/><text x="54" y="165">NotificationListenerService</text>
  <rect x="40" y="194" width="244" height="40" rx="8" fill="#1e293b"/><text x="54" y="219">ControlAccessibilityService</text>
  <rect x="40" y="248" width="244" height="40" rx="8" fill="#1e293b"/><text x="54" y="273">BridgeKeyboard IME</text>
  <rect x="40" y="302" width="244" height="40" rx="8" fill="#1e293b"/><text x="54" y="327">Telemetry &amp; clipboard</text>
  <rect x="40" y="380" width="244" height="58" rx="8" fill="#1e293b"/><text x="54" y="404">MediaProjection → VirtualDisplay</text><text x="54" y="424" fill="#94a3b8" font-size="11.5">H.264 VBR, no B-frames</text>

  <!-- wire boxes -->
  <rect x="380" y="140" width="200" height="202" rx="10" fill="#2a1a0e" stroke="#FF5E00"/>
  <text x="480" y="232" text-anchor="middle" font-weight="700">Control socket</text>
  <text x="480" y="252" text-anchor="middle" fill="#fdba74" font-size="11.5">JSON frames</text>
  <rect x="380" y="380" width="200" height="58" rx="10" fill="#2a1a0e" stroke="#FF5E00"/>
  <text x="480" y="404" text-anchor="middle" font-weight="700">Video socket</text>
  <text x="480" y="424" text-anchor="middle" fill="#fdba74" font-size="11.5">binary H.264</text>

  <!-- mac boxes -->
  <rect x="676" y="140" width="244" height="40" rx="8" fill="#1e293b"/><text x="690" y="159">UNUserNotificationCenter</text><text x="690" y="174" fill="#94a3b8" font-size="11">reply · dismiss · mute</text>
  <rect x="676" y="194" width="244" height="40" rx="8" fill="#1e293b"/><text x="690" y="219">MenuBarExtra, Settings, HUD</text>
  <rect x="676" y="248" width="244" height="40" rx="8" fill="#1e293b"/><text x="690" y="273">NSEvent / NSTextInputClient</text>
  <rect x="676" y="380" width="244" height="58" rx="8" fill="#1e293b"/><text x="690" y="404">VTDecompressionSession (HW)</text><text x="690" y="424" fill="#94a3b8" font-size="11.5">→ IOSurface-backed CALayer</text>
</g>

<g stroke="#cbd5e1" stroke-width="1.6" fill="none">
  <line x1="286" y1="160" x2="378" y2="160" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="286" y1="214" x2="378" y2="214" marker-start="url(#a)"/>
  <line x1="286" y1="268" x2="378" y2="268" marker-start="url(#a)"/>
  <line x1="286" y1="322" x2="378" y2="322" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="286" y1="409" x2="378" y2="409" marker-end="url(#a)"/>
  <line x1="582" y1="160" x2="674" y2="160" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="582" y1="214" x2="674" y2="214" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="582" y1="268" x2="674" y2="268" marker-start="url(#a)"/>
  <line x1="582" y1="409" x2="674" y2="409" marker-end="url(#a)"/>
</g>

<!-- discovery -->
<rect x="24" y="480" width="912" height="56" rx="12" fill="none" stroke="#64748b" stroke-dasharray="6 5"/>
<text x="480" y="504" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Discovery, raced in parallel on every network change</text>
<text x="480" y="523" text-anchor="middle" fill="#94a3b8" font-size="12">UDP broadcast on port 47322 · mDNS _droidbridge._tcp · last-known IP</text>
</svg>
